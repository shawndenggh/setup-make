name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n scripts/setup-make.sh
          shellcheck scripts/setup-make.sh
      - name: Reuse existing Make
        uses: ./
      - name: Remove Make to exercise installation
        run: sudo apt-get remove -y make
      - name: Install through composite action
        uses: ./
      - name: Verify subsequent step
        run: printf 'all:\n\t@echo setup-make-ok\n' | make -f -
      - name: Reject unsupported runner OS
        run: |
          if RUNNER_OS=Windows bash scripts/setup-make.sh; then
            echo 'Expected unsupported runner OS to fail'
            exit 1
          fi
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            user: root
            mirror: ''
          - image: debian:bookworm-slim
            user: root
            mirror: ''
          - image: ubuntu:24.04
            user: runner
            mirror: ''
          - image: ubuntu:24.04
            user: root
            mirror: https://mirrors.aliyun.com/ubuntu
          - image: ubuntu:24.04
            user: runner
            mirror: https://mirrors.aliyun.com/ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Test installation in minimal container
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_USER: ${{ matrix.user }}
          SETUP_MAKE_MIRROR: ${{ matrix.mirror }}
        run: |
          docker run --rm -v "$PWD:/action:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -e TEST_USER -e SETUP_MAKE_MIRROR "$TEST_IMAGE" bash -euc '
            if command -v make; then
              echo "Expected a minimal container without Make"
              exit 1
            fi
            if SETUP_MAKE_MIRROR="invalid mirror" bash /action/scripts/setup-make.sh; then
              echo "Expected invalid mirror to fail"
              exit 1
            fi
            if [[ "$TEST_USER" == runner ]]; then
              apt-get update
              apt-get install -y --no-install-recommends sudo
              useradd -m runner
              echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
              chmod 440 /etc/sudoers.d/runner
            fi
            if [[ -n "$SETUP_MAKE_MIRROR" ]]; then
              status=0
              SETUP_MAKE_MIRROR=http://127.0.0.1:9/ubuntu bash /action/scripts/setup-make.sh || status=$?
              [[ "$status" -eq 100 ]]
              echo "deb http://127.0.0.1:9/ppa noble main" > /etc/apt/sources.list.d/unreachable.list
            fi
            sources_before="$(find /etc/apt -type f -exec sha256sum {} + | sort)"
            if [[ "$TEST_USER" == runner ]]; then
              sudo -u runner env SETUP_MAKE_MIRROR="$SETUP_MAKE_MIRROR" bash /action/scripts/setup-make.sh
              sudo -u runner env SETUP_MAKE_MIRROR=http://127.0.0.1:9/ubuntu bash /action/scripts/setup-make.sh
            else
              bash /action/scripts/setup-make.sh
              SETUP_MAKE_MIRROR=http://127.0.0.1:9/ubuntu bash /action/scripts/setup-make.sh
            fi
            [[ "$sources_before" == "$(find /etc/apt -type f -exec sha256sum {} + | sort)" ]]
            if command -v gcc || command -v g++ || [[ -f /usr/include/stdio.h ]]; then
              echo "Make installation must not install compilers or C headers"
              exit 1
            fi
            printf "all:\n\t@echo setup-make-ok\n" | make -f -
          '
